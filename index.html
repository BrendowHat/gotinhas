<script>
  // Alguns navegadores de celular (ex.: app do Google, "site para computador") desenham a página
  // como se a tela fosse bem mais larga. Aqui a gente compensa com zoom pra ficar no tamanho certo.
  (function ajustarZoom() {
    var toque = matchMedia("(pointer: coarse)").matches;
    var tela = Math.min(screen.width, screen.height);
    if (toque && tela < 600 && innerWidth > tela * 1.2) {
      document.documentElement.style.zoom = (innerWidth / tela).toFixed(3);
    }
  })();
</script>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
        reg.update().catch(() => {});
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
      }).catch(() => {});
    });
    // quando uma versão nova assume, recarrega uma vez pra já mostrar a novidade
    let recarregou = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (recarregou) return;
      recarregou = true;
      location.reload();
    });
  }
</script>
